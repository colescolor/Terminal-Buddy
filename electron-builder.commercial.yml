extends: ./electron-builder.yml
appId: com.terminalbuddy.subscription
productName: Terminal Buddy Subscription
copyright: "Copyright (c) 2026 Terminal Buddy contributors"
directories:
  output: release-commercial
toolsets:
  nsis: '1.2.1'
nsis:
  shortcutName: Terminal Buddy Subscription
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  packElevateHelper: false
  deleteAppDataOnUninstall: false
  artifactName: Terminal-Buddy-Setup-${version}-${arch}.${ext}
win:
  artifactName: Terminal-Buddy-Subscription-${version}-${arch}.${ext}
portable:
  artifactName: Terminal-Buddy-Subscription-${version}-portable.${ext}
mac:
  artifactName: Terminal-Buddy-Subscription-${version}-mac-${arch}.${ext}
