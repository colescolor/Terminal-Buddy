name: macOS builds
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:account && npm run test:platform && npm run test:settings && npm run test:alerts && npm run test:submit && npm run test:screen && npm run test:mac-downloads
      # Explicit ad-hoc signing is for test betas only, not Developer ID trust.
      - run: npm run dist:mac:beta -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged terminal, process and keyboard smoke test
        run: npm run test:platform-app
        timeout-minutes: 3
        env:
          BUDDY_EXE: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Terminal Buddy.app/Contents/MacOS/Terminal Buddy
      - name: Independent workspace smoke test
        run: npm run test:windows
        timeout-minutes: 4
        env:
          BUDDY_EXE: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Terminal Buddy.app/Contents/MacOS/Terminal Buddy
      - name: Launcher smoke test
        run: npm run test:launcher
        timeout-minutes: 4
        env:
          BUDDY_EXE: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Terminal Buddy.app/Contents/MacOS/Terminal Buddy
      - name: Custom assistant smoke test
        run: npm run test:assistants
        timeout-minutes: 4
        env:
          BUDDY_EXE: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Terminal Buddy.app/Contents/MacOS/Terminal Buddy
      - run: npm run downloads:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Terminal-Buddy-mac-${{ matrix.arch }}
          path: release/mac-downloads/${{ matrix.arch }}/
          if-no-files-found: error
