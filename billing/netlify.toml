# Separate, unlaunched TEST billing project. Do not replace the existing static site's config.
[build]
command = "npm ci && npm run build"
publish = "public"
functions = "functions"
[build.environment]
NODE_VERSION = "22"
[functions]
node_bundler = "esbuild"
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
